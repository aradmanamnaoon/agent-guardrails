name: Skill behavior or boundary feedback
description: Report synthetic evidence about a requested pause or check
title: "[skill-feedback] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        These Markdown skills are advisory, not runtime-enforced safety controls.
        Reports about stops or failures should contain synthetic examples only.
        Do not submit credentials, private prompts or proprietary tool logs.
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - recon
        - preflight
        - hold
        - scope
        - budget
        - Composition of skills
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Host, model and skill commit
      placeholder: "Agent host/version, model, repository SHA"
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Reproduction with synthetic data
      description: Include the task, enabled skills/tools and observed checkpoint or missing pause
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: No private data or access tokens are included
          required: true
